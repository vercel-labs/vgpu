name: Main PR policy
run-name: >-
  Main policy PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.base.sha }} -> ${{ github.event.pull_request.head.sha }}

on:
  # Unlike pull_request, this always loads the workflow from the trusted default branch. The
  # candidate checkout below is data only and must never be built, installed, imported, or run.
  pull_request_target:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        ready_for_review,
        edited,
        labeled,
        unlabeled,
      ]

# This workflow evaluates candidate commits but never executes their code. Both the workflow and
# policy scripts come from the same pinned canary control-plane revision. The candidate always gets
# a separate checkout and is treated only as data.
permissions:
  checks: write
  contents: read
  statuses: read

jobs:
  main-policy:
    # pull_request_target jobs attach to the default-branch SHA, so this job publishes a dedicated
    # `main-policy` check on the PR head. Keep the automatic job check under a different name.
    name: main-policy-evaluator
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start trusted main-policy check on the PR head
        id: start-policy-check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          external_id="main-policy:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_WORKFLOW_SHA}:${PR_NUMBER}:${PR_BASE_SHA}:${PR_HEAD_SHA}"
          check_id="$(gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/check-runs" \
            --field name=main-policy \
            --field head_sha="$PR_HEAD_SHA" \
            --field status=in_progress \
            --field details_url="$RUN_URL" \
            --field external_id="$external_id" \
            --jq '.id')"
          if [[ ! "$check_id" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::GitHub did not return a valid main-policy check-run ID."
            exit 1
          fi
          echo "check-run-id=$check_id" >> "$GITHUB_OUTPUT"

      - name: Reject forked main PRs before candidate checkout
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$PR_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PRs into main must use a branch in this repository, not a fork."
            exit 1
          fi

      - name: Checkout the trusted policy revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .main-policy/trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout candidate without executing it
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: .main-policy/candidate
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Enforce main entry policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: >-
          node .main-policy/trusted/scripts/check-main-pr-policy.mjs
          .main-policy/candidate

      - name: Complete trusted main-policy check on the PR head
        if: ${{ always() && steps.start-policy-check.outputs.check-run-id != '' }}
        env:
          CHECK_RUN_ID: ${{ steps.start-policy-check.outputs.check-run-id }}
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail

          conclusion=failure
          if [ "$JOB_STATUS" = "success" ]; then
            conclusion=success
          fi
          if ! gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
              --field status=completed \
              --field conclusion="$conclusion" \
              >/dev/null; then
            # The API can accept a write even if its response is interrupted. Confirm the exact
            # check before deciding that finalization failed.
            observed="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK_RUN_ID}" \
              --jq '[.status, .conclusion] | join(":")')"
            if [ "$observed" != "completed:$conclusion" ]; then
              echo "::error::Could not finalize main-policy check ${CHECK_RUN_ID}; observed $observed."
              exit 1
            fi
            echo "::warning::Confirmed main-policy check after its PATCH response was interrupted."
          fi
