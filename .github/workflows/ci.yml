name: CI

on:
  push:
    branches: [main, feat/vgpu-rewrite]
  pull_request:

jobs:
  test-fast:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:filenames
      - run: pnpm -w typecheck
      - run: pnpm exec vitest run
      - run: pnpm bundle-check

  wgsl-loader-bundler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test packages/wgsl/tests/webpack-real.test.ts packages/wgsl/tests/vite-real.test.ts packages/wgsl/tests/runtime-cjs-require.test.ts

  docker-gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -w typecheck
      - name: Build Docker GPU image
        run: docker build -t vgpu-test-dev:ci -f infra/test-docker/Dockerfile.dev .
      - name: Run Dawn GPU validation in Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e VGPU_VALIDATE=require \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm exec vitest run packages/adapter-node/tests/buffer-readback.test.ts packages/wgsl/tests/reflection-gpu-layout.test.ts packages/wgsl/tests/representative-shaders.test.ts packages/wgsl/tests/validation-real-device.test.ts packages/wgsl/tests/validation.test.ts packages/vgpu-api/tests/gpu examples/fluid-validation/src/fluid-gpu.test.ts examples/prism-validation/src/prism-gpu.test.ts; \
              s=$?; kill $xp; exit $s'
      - name: Run pixel snapshot CLI in Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              node packages/vgpu/bin/vgpu.js snapshot --ci; \
              s=$?; kill $xp; exit $s'
      - name: Render docs example proofs in Docker
        run: |
          rm -rf artifacts/example-renders
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm --filter docs render:proof; \
              s=$?; kill $xp; exit $s'
      - name: Upload docs example render proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-example-renders
          path: artifacts/example-renders/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Compare docs example thumbnails in Docker
        run: |
          rm -rf artifacts/thumb-diffs
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VGPU_DOCKER_TEST=1 \
            -e CI=true \
            vgpu-test-dev:ci \
            sh -lc 'Xvfb :99 -screen 0 1024x768x24 >/tmp/xvfb.log 2>&1 & xp=$!; \
              pnpm --filter docs thumbs:check -- --artifact-dir ../../artifacts/thumb-diffs; \
              s=$?; kill $xp; exit $s'
      - name: Upload docs thumbnail comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-thumb-comparison
          path: artifacts/thumb-diffs
          if-no-files-found: error
          retention-days: 7

  wgsl-cachekey-determinism:
    name: wgsl-cachekey-determinism (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This suite loads the repo's own vitest.config.ts, which imports @vgpu/wgsl's Vite loader
      # by *source path* (./packages/wgsl/src/...), not by package name. Vite's config-file
      # bundler (a separate, alias-unaware esbuild pass that runs before the config it's loading
      # can supply any resolve.alias) therefore parses that source file's contents directly — and
      # since @vgpu/wgsl's validation device now imports the optional @vgpu/adapter-node peer dep
      # via a literal specifier (so bundlers like webpack/Next can see it; see the wgsl-loader
      # bundler tests and validation-device.ts for why), that literal is statically resolvable and
      # esbuild tries to. @vgpu/adapter-node's package.json only exports a built dist/, so this
      # needs it (and its own dependency chain, @vgpu/core <- @vgpu/wgsl) built first. A real
      # consumer never hits this: they import the loader by package name, which esbuild always
      # externalizes without reading its contents, so the dynamic import stays opaque to it.
      - run: pnpm --filter @vgpu/adapter-node build
      - name: Test examples CLI filesystem portability
        run: pnpm exec vitest run packages/vgpu/tests/examples
      - run: pnpm test packages/wgsl/tests/cache-key.test.ts

  examples-windows-online:
    name: examples-windows-online
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vgpu/adapter-node build
      - name: Test examples online commands on Windows
        run: pnpm exec vitest run packages/vgpu/tests/examples/http-client.test.ts

  wgsl-turbopack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vgpu/wgsl build
      - name: next build (turbopack)
        run: pnpm --filter @vgpu/example-next-wgsl exec next build --turbopack
      - name: assert WGSL content in Turbopack output
        run: |
          grep -Rn "helper_color" examples/next-wgsl/.next/server examples/next-wgsl/.next/static > /tmp/wgsl-build-helper-matches.txt
          head -20 /tmp/wgsl-build-helper-matches.txt
          grep -Rn "0.1, 0.2, 0.3" examples/next-wgsl/.next/server examples/next-wgsl/.next/static > /tmp/wgsl-build-color-matches.txt
          head -20 /tmp/wgsl-build-color-matches.txt
      - name: next dev HMR smoke (turbopack)
        run: |
          set -euo pipefail
          HELPER=examples/next-wgsl/app/helper.wgsl
          ORIGINAL=$(cat "$HELPER")
          cleanup() {
            printf '%s\n' "$ORIGINAL" > "$HELPER"
            if [ -n "${SERVER_PID:-}" ] && kill -0 "$SERVER_PID" 2>/dev/null; then
              kill "$SERVER_PID" 2>/dev/null || true
              wait "$SERVER_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          pnpm --filter @vgpu/example-next-wgsl exec next dev --turbopack -p 3100 > /tmp/next-wgsl-dev.log 2>&1 &
          SERVER_PID=$!
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3100/ > /tmp/wgsl-before.html; do sleep 1; done'
          grep -q "0.1, 0.2, 0.3" /tmp/wgsl-before.html
          cat > "$HELPER" <<'EOF'
          export fn helper_color() -> vec4f { return vec4f(0.9, 0.8, 0.7, 1.0); }
          EOF
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:3100/ > /tmp/wgsl-after.html && grep -q "0.9, 0.8, 0.7" /tmp/wgsl-after.html; do sleep 1; done'
          grep -n "0.9, 0.8, 0.7" /tmp/wgsl-after.html | head -5
          python3 - <<'PY'
          from pathlib import Path
          text = Path("/tmp/wgsl-after.html").read_text()
          idx = text.find("0.9, 0.8, 0.7")
          print(text[max(0, idx - 120):idx + 160] if idx >= 0 else text[:280])
          PY
          tail -30 /tmp/next-wgsl-dev.log


  # Gate G1 of the geistdocs migration (Decision 1'): the docs app build plus the four checks that
  # can only be evaluated against the `.next` this job just produced. Named `docs-app-build` for the
  # same reason the app directory is named `apps/docs`: it is the docs app, and the required status
  # check kept reporting across the cutover without a branch-protection edit.
  docs-app-build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs app
        run: pnpm --filter docs build
      # The tracing check asserts against .next/server/app of THIS build, so it has to run in the
      # same job, right after it. It is the only thing that can catch one of the three picomatch
      # keys in apps/docs/next.config.ts silently stopping to match its route.
      - name: Check the examples API artifact tree is bundled into its routes
        run: pnpm --filter docs check:examples-api-tracing
      # Third member of G1 ("build + check:examples-api-tracing + check:example-bundles",
      # Decision 1'). It grades the /preview/[slug] production chunks against
      # scripts/example-chunk-budgets.json and asserts no example chunk carries another example's
      # renderer/WGSL. It must stay inside this job, right after the build: the script measures
      # .next/static/chunks and never builds (it hard-fails on chunks older than the sources rather
      # than grade a stale tree).
      - name: Check example bundle isolation and budgets
        run: pnpm --filter docs check:example-bundles
      # Closes the gate hole TGEIST-14 found: `next build` (the step above)
      # passes even when a same-origin ML asset 404s under the i18n proxy, because nothing it
      # rendered is missing — the asset is fetched at runtime, not rendered as a page — and
      # `thumbs:check` (gate G6) can't catch it either, since it renders in Node with no proxy in
      # the loop. This starts `next start` on THIS build and asserts every committed ONNX model,
      # `/ort/manifest.json` and the staged depth models come back 200, byte-identical and with no
      # `x-middleware-rewrite` header (the literal signature of the proxy rewriting the asset to
      # `/en/...` before it reaches the static file). Must stay in this job, right after the build,
      # for the same reason as the two checks above: it grades this exact `.next`.
      - name: Check ML asset smoke (no i18n-proxied 404s)
        run: pnpm --filter docs check:ml-asset-smoke
      # Sibling of the ML asset smoke step above, same failure mode,
      # different asset class: `next build` (two steps up) passes even when a static file under
      # public/examples/** (the <slug>.card.png / <slug>.hero.png thumbnails,
      # depth-estimation/source.jpg) 404s under the i18n proxy, and `thumbs:check` (gate G6) can't
      # catch it either, for the same reason it can't catch the ML assets. This starts `next start`
      # on THIS build and asserts every file committed under public/examples/** comes back 200,
      # byte-identical and with no `x-middleware-rewrite` header, while re-checking a few
      # /examples/[slug] page routes are still proxied. Must stay in this job, right after the
      # build, for the same reason as the checks above: it grades this exact `.next`.
      - name: Check example static asset smoke (no i18n-proxied 404s)
        run: pnpm --filter docs check:example-static-asset-smoke
      # Remark plugins M1-M9 (gate (c) of Decision 4 runs in `docs-parity` below).
      # `test:remark` unit-tests the mappings (including the adversarial case the
      # design names: a `*.docs.md` path inside a code-span that must NOT be
      # rewritten). `check:mdast-parity` is the render-parity gate: for every
      # page, the text of the mdast before the plugins must equal the text after
      # them, modulo whitespace — M1-M9 only change node types and attributes, so
      # any plugin that loses content fails here. It also asserts (a) every fence
      # language surviving the chain is one Shiki can load, which is what makes
      # the 19 ` ```terminal ` fences a build error rather than a surprise, and
      # (b) no `*.docs.md`/bare logical link survives unresolved (the 85 links
      # that would 404). Runs against the fixtures today and automatically
      # against `content/docs/**` once TGEIST-04 lands the real corpus.
      - name: Unit-test the docs remark plugins (M1-M9)
        run: pnpm --filter docs test:remark
      # TGEIST-12 moved `check:mdast-parity` out of this job: it is gate (c) of Decision 4 and now
      # runs inside `docs-parity` below, next to gates (a), (b) and (d), so the four of them report
      # as one suite (that suite is the evidence F5 is approved on, per risk #9 — "PR de cutover
      # irrevisable a ojo"). It is deliberately NOT duplicated here: two copies of a gate mean the
      # next person to touch it fixes one of them.

  # Decision 4 ("Validación de paridad"), the four gates as a single suite plus
  # the two checks that make their oracles trustworthy. Order is cheapest-first so a broken corpus
  # costs seconds instead of a full Next build; each step is named after the gate it implements, and
  # each prints its own verdict (never one opaque "all ok"):
  #
  #   schemas → the corpus satisfies the real @vercel/geistdocs Zod schemas (deferred here from
  #             TGEIST-04, which had no install available in its job). A frontmatter failure this
  #             finds in a second would otherwise surface as a fumadocs-mdx error minutes into (a).
  #   (b)     → emission parity: every manifest record's page body is exactly its source minus
  #             frontmatter, H1 and first paragraph (built by TGEIST-04).
  #   (c)     → render parity: mdast text before the M1-M9 chain === after it, over the full
  #             96-page corpus rather than the fixtures (built by TGEIST-05).
  #   (a)     → compile gate: `next build` renders the whole tree. The first real compile gate this
  #             documentation has ever had (risk #3 of the dossier).
  #   (d)     → URL + anchor parity against `docs/url-inventory.json`, frozen from vgpu.sh in F1,
  #             served by a real `next start` so redirects and the i18n proxy are in the loop, plus
  #             the corpus link checker. This is the only gate that can see a live URL 404 after the
  #             cutover; `next build` cannot, because nothing it was asked to render is missing.
  #
  # This job builds the app a second time (`docs-app-build` above already did): gate (d) needs a
  # production server, and passing a multi-hundred-MB `.next` between jobs as an artifact is slower
  # than rebuilding it.
  #
  # The drift half of Decision 4 ("content/docs/** commiteado no puede driftear") lives in
  # `check-drift.js`, run by the `docs-generated` job below — it needs no install and no build, so
  # it belongs in the fast job, and putting it in both would just decay.
  docs-parity:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Corpus schemas — geistdocs frontmatter + meta.json (Zod, real package schemas)
        run: node apps/docs/scripts/check-content-schemas.mjs
      - name: Gate (b) — content emission parity against the docs manifest
        run: node packages/vgpu/lib/docs/generate/check-docs-content.mjs
      - name: Gate (c) — mdast render parity over the full corpus (M1-M9)
        run: pnpm --filter docs check:mdast-parity
      - name: Gate (a) — compile gate, next build of the whole content/docs tree
        run: pnpm --filter docs build
      # Both halves of gate (d) run against the build produced by the step above, in this job, on a
      # server this script starts and stops itself. `--json` keeps the machine-readable report: it
      # carries the ids every page really renders, which is what lets the link checker verify
      # `#fragment` targets against observed HTML instead of a second implementation of
      # github-slugger.
      - name: Gate (d) — URL + anchor parity vs the frozen docs/url-inventory.json
        run: node apps/docs/scripts/check-url-anchor-parity.mjs --json=url-anchor-report.json
      - name: Gate (d) — corpus link checker (M7/M8/M9 resolve, M10 reported)
        run: node apps/docs/scripts/check-doc-links.mjs --anchors-from=url-anchor-report.json
      # Uploaded even on failure: this report is the artifact the cutover PR is reviewed against.
      - name: Upload the URL + anchor parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-url-anchor-parity
          path: url-anchor-report.json
          if-no-files-found: warn

  docs-generated:
    # Guards that the committed docs manifest + generated skill (skills/vgpu, the payload
    # `npx skills add vercel-labs/vgpu` ships) are in sync with their sources (co-located
    # *.docs.md, docs/topics, docs/allowlist.txt, and the generator itself). The generator is
    # dependency-free (pure Node), so no install/build is needed. check-drift.js regenerates into a
    # scratch temp dir (it never mutates the working tree) and normalizes the SKILL.md stamp
    # (vgpuVersion/gitSha/generatedAt) before diffing, since that stamp is volatile by design.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # TGEIST-12 extended this script to the geistdocs target as well, so this one step now covers
      # both committed generator outputs: skills/vgpu + the docs manifest, AND
      # apps/docs/content/docs (Decision 4's closing line). It regenerates both into a temp dir
      # and diffs — it never writes to the working tree, which is what replaced TGEIST-04's
      # "regenerate then `git diff --exit-code`" pair here (that pair mutated the checkout, so it
      # could not run locally on a dirty tree and its failure message was a raw diff).
      - name: Check skills/vgpu + docs manifest + content/docs for drift
        run: node packages/vgpu/lib/docs/generate/check-drift.js
      - name: Check docs/nav.json coverage against the docs manifest
        run: node scripts/check-nav-coverage.mjs
      # TGEIST-12: the coverage check above cannot see a *deletion*. Every curated level of
      # docs/nav.json ends in an explicit "..." catch-all, so removing (or reordering) an entry keeps
      # coverage green while silently demoting the page to the alphabetical fallback at the bottom of
      # the sidebar. The snapshot makes that a reviewed change instead of an invisible one.
      - name: Check docs/nav.json curation against its snapshot
        run: node scripts/check-nav-curation.mjs
      # Gate (b) of Decision 4 (content emission parity) moved to the `docs-parity` job above, where
      # it reports next to gates (a), (c) and (d) as one suite. It is not duplicated here.

  examples-api-generated:
    # Frozen schemas, controlled vocabulary, and deterministic revision artifacts.
    runs-on: ubuntu-24.04-arm
    steps:
      # The artifact revision is a content hash of the source snapshot, so this job never reads
      # repository history: a shallow checkout is sufficient and merge strategy is irrelevant.
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The vitest run below loads the repo's own vitest.config.ts, which imports @vgpu/wgsl's
      # Vite loader by source path and therefore needs @vgpu/adapter-node (and its own dependency
      # chain, @vgpu/core <- @vgpu/wgsl) built first. See the identical comment on
      # wgsl-cachekey-determinism above for the full explanation.
      - run: pnpm --filter @vgpu/adapter-node build
      - name: Validate authored controlled vocabulary
        run: node apps/docs/scripts/validate-example-vocabulary.mjs
      - name: Synchronize frozen embedded schemas
        run: node apps/docs/scripts/sync-examples-api-contracts.mjs
      # G3 of Decision 1': the artifact revision is a digest of the source snapshot and of nothing
      # else (not the app directory, not git history). That is what let the geistdocs migration
      # regenerate this tree in a second app directory and get byte-identical output, and it is what
      # `git status` below keeps true.
      - name: Regenerate deterministic examples API artifacts
        run: node apps/docs/scripts/generate-examples-api.mjs
      - name: Test foundation contracts and publisher
        run: pnpm exec vitest run apps/docs/lib/examples-api apps/docs/scripts/validate-example-vocabulary.test.ts
      - name: Fail on schema or artifact drift
        run: |
          changed=$(git status --porcelain -- apps/docs/generated/examples-api apps/docs/lib/examples-api/schemas packages/vgpu/lib/examples/schemas packages/vgpu/lib/examples/contracts.js apps/docs/lib/examples-api/contracts.generated.ts)
          if [ -n "$changed" ]; then
            echo "::error::Examples API schemas or generated artifacts are out of date."
            echo "$changed"
            git diff -- apps/docs/generated/examples-api apps/docs/lib/examples-api/schemas packages/vgpu/lib/examples/schemas packages/vgpu/lib/examples/contracts.js apps/docs/lib/examples-api/contracts.generated.ts
            exit 1
          fi
